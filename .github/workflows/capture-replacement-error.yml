name: Capture artwork replacement error

on:
  push:
    paths:
      - .github/workflows/capture-replacement-error.yml

permissions:
  actions: read
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture the failing step tail
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -L -sS \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/jobs/89696036548/logs" \
            -o /tmp/job.log
          tail -n 90 /tmp/job.log > .github/replacement-error-tail.txt
      - name: Commit error tail and remove this one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/replacement-error-tail.txt
          git rm .github/workflows/capture-replacement-error.yml
          git commit -m "chore: record artwork replacement error tail"
          git push
