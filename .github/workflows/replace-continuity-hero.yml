name: Replace Cognitive Continuity hero artwork

on:
  push:
    paths:
      - .github/workflows/replace-continuity-hero.yml

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate a non-anatomical continuity composition
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from io import BytesIO
          from pathlib import Path
          from urllib.parse import quote
          from urllib.request import Request, urlopen
          from PIL import Image, ImageOps, ImageFilter

          prompt = (
              "wide cinematic abstract editorial artwork, many thin translucent glass strata suspended at different "
              "depths in midnight blue space, one delicate luminous cyan fiber weaving through selected planes and "
              "linking small geometric source nodes, a clear branching revision path, restrained coral conflict "
              "markers, several obsolete planes fading away, one precise clean empty gap representing deliberate "
              "removal, spacious dark left side, elegant archival atmosphere, crisp geometry, refined and calm, "
              "entirely non-biological and non-anatomical, no brain, no head, no body, no neurons, no people, no "
              "faces, no words, no letters, no logos, no screens, no dashboard, no database cylinder, no filing cabinet"
          )
          encoded = quote(prompt, safe='')
          urls = [
              f"https://pollinations.ai/p/{encoded}?width=1536&height=864&seed=271828&nologo=true&enhance=true",
              f"https://image.pollinations.ai/prompt/{encoded}?width=1536&height=864&seed=271828&nologo=true&enhance=true",
              f"https://gen.pollinations.ai/image/{encoded}?width=1536&height=864&seed=271828&nologo=true",
          ]
          payload = None
          errors = []
          for url in urls:
              try:
                  req = Request(url, headers={
                      'User-Agent': 'Mozilla/5.0 (compatible; documentation-art-generator/1.0)',
                      'Accept': 'image/avif,image/webp,image/png,image/jpeg,*/*',
                  })
                  with urlopen(req, timeout=240) as response:
                      candidate = response.read()
                      ctype = response.headers.get_content_type()
                  image = Image.open(BytesIO(candidate))
                  image.verify()
                  if image.width < 512 or image.height < 288:
                      raise ValueError(f"image too small: {image.size}")
                  payload = candidate
                  print(f"Accepted {url.split('/')[2]}: {ctype}, {len(candidate)} bytes, {image.size}")
                  break
              except Exception as exc:
                  errors.append(f"{url.split('/')[2]}: {type(exc).__name__}: {exc}")
          if payload is None:
              raise SystemExit('All image routes failed:\n' + '\n'.join(errors))

          image = Image.open(BytesIO(payload)).convert('RGB')
          image = ImageOps.fit(image, (1600, 900), method=Image.Resampling.LANCZOS)
          image = image.filter(ImageFilter.UnsharpMask(radius=1.0, percent=55, threshold=3))
          output = Path('docs/assets/cognitive-continuity-hero.png')
          output.parent.mkdir(parents=True, exist_ok=True)
          image.save(output, format='PNG', optimize=True)
          check = Image.open(output)
          if check.format != 'PNG' or check.size != (1600, 900) or output.stat().st_size < 100_000:
              raise SystemExit(f"Raster verification failed: {check.format} {check.size} {output.stat().st_size}")
          print(f"Verified replacement: {output.stat().st_size} bytes")
          PY
      - name: Commit replacement and remove this one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/cognitive-continuity-hero.png
          git rm .github/workflows/replace-continuity-hero.yml
          git commit -m "Replace Cognitive Continuity hero with non-anatomical artwork"
          git push
