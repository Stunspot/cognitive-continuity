name: Generate Cognitive Continuity hero artwork

on:
  push:
    paths:
      - .github/workflows/capture-continuity-hero.yml

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate and verify the raster artwork
        run: |
          python -m pip install --quiet --upgrade gradio_client pillow
          python - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          from PIL import Image, ImageOps, ImageFilter
          from gradio_client import Client
          import shutil

          prompt = (
              "Wide 16:9 text-free premium editorial digital illustration for Cognitive Continuity, "
              "continuity shown as a governed living archive rather than a brain or computer interface, "
              "one fine luminous cyan thread moving through layered translucent strata of episodes, typed records, "
              "and task-shaped packets, source-linked nodes, visible supersession branches, one carefully cleared "
              "absence where forgotten derivatives were removed, several dim records allowed to fall outside active "
              "context, deep midnight navy and graphite, pale blue, restrained warm coral only for conflict or expiry, "
              "elegant archival depth, humane ecological atmosphere, generous quiet negative space on the left for "
              "headline typography, no people, no faces, no logos, no words, no letters, no UI dashboard, no filing "
              "cabinets, no literal brain, no database cylinder, no flat vector icon scene"
          )

          result = Client("black-forest-labs/FLUX.1-schnell", verbose=True).predict(
              prompt, 918273, False, 1536, 864, 4, api_name="/infer"
          )
          candidate = result[0] if isinstance(result, (tuple, list)) else result
          if isinstance(candidate, dict):
              candidate = candidate.get("path") or candidate.get("url") or candidate.get("name")
          if not isinstance(candidate, str):
              raise SystemExit(f"Unsupported image result: {candidate!r}")

          working = Path("/tmp/continuity-source")
          if candidate.startswith(("http://", "https://")):
              request = Request(candidate, headers={"User-Agent": "Mozilla/5.0"})
              working.write_bytes(urlopen(request, timeout=120).read())
          else:
              source = Path(candidate)
              if not source.exists():
                  raise SystemExit(f"Returned image path does not exist: {candidate}")
              shutil.copyfile(source, working)

          image = Image.open(working).convert("RGB")
          image = ImageOps.fit(image, (1600, 900), method=Image.Resampling.LANCZOS)
          image = image.filter(ImageFilter.UnsharpMask(radius=1.0, percent=55, threshold=3))
          output = Path("docs/assets/cognitive-continuity-hero.png")
          output.parent.mkdir(parents=True, exist_ok=True)
          image.save(output, format="PNG", optimize=True)

          check = Image.open(output)
          if check.format != "PNG" or check.size != (1600, 900) or output.stat().st_size < 100_000:
              raise SystemExit(f"Raster verification failed: {check.format} {check.size} {output.stat().st_size}")
          print(f"Verified {output}: PNG {check.width}x{check.height}, {output.stat().st_size} bytes")
          PY

      - name: Commit the asset and remove this one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/cognitive-continuity-hero.png
          git rm .github/workflows/capture-continuity-hero.yml
          git commit -m "Add generated Cognitive Continuity hero artwork"
          git push
