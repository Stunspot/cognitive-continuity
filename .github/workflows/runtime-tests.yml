name: Runtime portability

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  runtime-tests:
    name: runtime-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run complete deterministic suite
        run: python -B -X utf8 -m unittest discover -s scripts/tests -p "test_*.py" -v
